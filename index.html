<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmad Muzahid Fahmi - Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
      color: #333;
    }

    /* Hero Section */
<section class="hero">
  <!-- Image behind -->
  <img src="Media/Full body.jpg">

  <!-- Text container -->
  <div class="hero-content">
    <h1>Hello, I am Ahmad Muzahid Fahmi.</h1>
    <h2>E-commerce & Technology Management Student</h2>
    <p>
      Passionate about digital transformation and business development.<br>
      My works are just a click away.
    </p>
  </div>
</section>


    /* Overlay for readability */
    .hero::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5); /* dark overlay */
    }

    .hero-content {
      position: relative;
      z-index: 1;
      background: #fff;
      padding: 2rem 3rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 700px;
    }

    .hero-content h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #0d253f;
    }

    .hero-content h2 {
      font-size: 1.5rem;
      font-weight: 500;
      color: #333;
      margin-bottom: 1rem;
    }

    .hero-content p {
      font-size: 1rem;
      color: #555;
    }
  </style>
</head>
<body>
  <!-- Navbar container -->
  <div id="navbar"></div>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Hello, I am Ahmad Muzahid Fahmi.</h1>
      <h2>E-commerce & Technology Management Student</h2>
      <p>Passionate about digital transformation and business development.<br> 
         My works are just a click away.</p>
    </div>
  </section>

  <!-- Script to fetch header -->
  <script>
    fetch("header.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
      });
  </script>
</body>
</html>
